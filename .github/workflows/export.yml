# GitHub Actions Workflow: Telegram Channel Export
# This workflow runs the export script periodically and deploys to GitHub Pages.

name: Export Telegram & Deploy

on:
  schedule:
    # Run every 3 hours (offset to :17 to avoid GitHub peak load delays)
    - cron: '17 */3 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  keepalive:
    # Prevent GitHub from disabling this workflow after 60 days of inactivity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflow alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .github/.keepalive
          git add .github/.keepalive
          if ! git diff --cached --quiet; then
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi

  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run export
        env:
          TELEGRAM_CHANNEL: firmaved
          POSTS_LIMIT: '100'
          POSTS_PER_PAGE: '20'
        run: python export_telegram.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📡 Update Telegram feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Get latest commit with updated data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
